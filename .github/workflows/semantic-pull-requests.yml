name: Lint PR

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  main:
    name: 🏷️ Validate PR title
    if: github.repository == 'RedStar071/redstar071.dev'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write # read the PR and post or delete the sticky comment
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint_pr_title
        with:
          scopes: |
            a11y
            blog
            ci
            config
            content
            deploy
            deps
            discord
            eslint
            og-image
            projects
            seo
            ui
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

            Examples:
              ✅ fix(ui): tighten hero spacing
              ✅ docs: update README
              ❌ fix(ui): Tighten hero spacing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        # When the previous step fails, the workflow would stop. This condition
        # keeps it going so the error message can be posted.
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            Pull request titles need to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/), and it looks like this one needs a small adjustment.

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      # Delete the previous comment once the title has been fixed
      - if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-title-lint-error
          delete: true
