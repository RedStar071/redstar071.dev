shellEmulator: true

trustPolicy: no-downgrade

# Legacy 6.x line (pulled in by Babel) predates npm provenance.
trustPolicyExclude:
  - semver@6.3.1

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": false
  core-js: false
  esbuild: false
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false
  workerd: false
