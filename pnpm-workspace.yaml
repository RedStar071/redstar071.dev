minimumReleaseAgeExclude:
  - "@nuxt/kit@4.7.0"
  - "@nuxt/nitro-server@4.7.0"
  - "@nuxt/nitro-v3-server@4.7.0"
  - "@nuxt/schema@4.7.0"
  - "@nuxt/vite-builder@4.7.0"
  - "@nuxt/vite-server@4.7.0"
  - nitropack@2.14.0
  - nuxt@4.7.0
  - nuxt-og-image@7.2.0
  - "@nuxt/ui@4.13.1"
shellEmulator: true

trustPolicy: no-downgrade

# Legacy 6.x line (pulled in by Babel) predates npm provenance.
trustPolicyExclude:
  - semver@6.3.1

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": false
  core-js: false
  esbuild: false
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false
  workerd: false
